<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Форма</title>
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Форма">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar">
    <button data-a="tab" data-t="home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Сегодня</span>
    </button>
    <button data-a="tab" data-t="workouts">
      <svg viewBox="0 0 24 24"><path d="M2 12h2m16 0h2M6 7v10M18 7v10M9 9v6m6-6v6M9 12h6"/></svg>
      <span>Тренировки</span>
    </button>
    <button data-a="tab" data-t="progress">
      <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3.5-4 3 2.5L19 8"/></svg>
      <span>Прогресс</span>
    </button>
    <button data-a="tab" data-t="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.5-5.5 7-5.5s6.200 2 7 5.500"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div id="player" hidden></div>
  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
